<!DOCTYPE html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Voice Controlled Notes App</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shoelace-css/1.0.0-beta16/shoelace.css">
        <link rel="stylesheet" href="styles.css">

    </head>
    <body>
        <div class="container">

          
            <h3 class="no-browser-support">Sorry, Your Browser Doesn't Support the Web Speech API. Try Opening This Demo In Google Chrome.</h3>

            <div class="app"> 
                <h3>Dictado</h3>
                <div class="input-single">
                    <textarea id="note-textarea" placeholder="Notas" rows="6"></textarea>
                </div>         
                <button id="start-record-btn" title="Start Recording">Iniciar Dictado</button>
                <button id="pause-record-btn" title="Pause Recording">Pausar Dictado</button>
                <button id="save-note-btn" title="Save Note">Grabar Nota</button>   
                <p id="recording-instructions">Presione  <strong>Iniciar Dictado</strong> Para iniciar dictado</p>
                
                <h3>Mis Notas</h3>
                <ul id="notes">
                    <li>
                        <p class="no-notes">Notas.</p>
                    </li>
                </ul>

            </div>

        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <script src="script.js"></script>

        <!-- Only used for the demos ads. Please ignore and remove. --> 
        <script src="https://cdn.tutorialzine.com/misc/enhance/v3.js" async></script>

    </body>
</html>
